name: Build

# Сборка debug-APK на каждый пуш и PR: ловит ошибки компиляции до релиза.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # gradle.properties в .gitignore (там локальный путь к JDK) — в CI
      # задаём нужные Android-свойства сами.
      - name: Gradle properties
        run: |
          cat >> gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          PROPS
      # Подпись тем же debug-ключом, что и локальные сборки: иначе Android
      # не ставит APK поверх уже установленного приложения. Ключ лежит в
      # секрете DEBUG_KEYSTORE_BASE64 (base64 от ~/.android/debug.keystore).
      - name: Debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Используется debug-ключ из секрета"
          else
            echo "::warning::Секрет DEBUG_KEYSTORE_BASE64 не задан — APK подписан случайным ключом и не встанет поверх локальной сборки"
          fi
      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
