name: Build

# Сборка APK на каждый пуш: ловит ошибки компиляции и выдаёт готовый APK
# в артефактах запуска.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare build
        uses: ./.github/actions/prepare
        with:
          keystore: ${{ secrets.NUTRILENS_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.NUTRILENS_KEYSTORE_PASSWORD }}
          leaderboard-repo: ${{ secrets.LEADERBOARD_REPO }}
          leaderboard-token: ${{ secrets.LEADERBOARD_TOKEN }}
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nutrilens-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
