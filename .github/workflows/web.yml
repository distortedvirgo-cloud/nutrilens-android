name: Web (iPhone PWA)

# Собирает веб-версию из web/ и публикует её в ветку gh-pages.
# Адрес: https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main, claude/nutrilens-redesign-zslzmy]
    # build.gradle.kts — оттуда берётся номер версии веба.
    paths: ['web/**', 'app/build.gradle.kts', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          # Адрес прокси лидерборда (Cloudflare Worker): Settings → Secrets and
          # variables → Actions → Variables → LEADERBOARD_API_URL. Не задан —
          # веб-лидерборд показывает «не подключён».
          VITE_LEADERBOARD_API: ${{ vars.LEADERBOARD_API_URL }}

      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
